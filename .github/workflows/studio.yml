name: Studio verification
on:
  push:
    branches: [main, feat/confenge-studio]
  pull_request:
    paths:
      - '**/studio/**'
      - '**/studio.*'
      - 'libraries/nestjs-libraries/src/database/prisma/schema.prisma'
      - '.github/workflows/studio.yml'
      - 'vitest.studio.config.mts'
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio_test_only
          POSTGRES_DB: studio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://studio:studio_test_only@localhost:5432/studio_test
      STUDIO_DATABASE_TESTS: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: corepack enable
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run prisma-generate
      - run: pnpm run prisma-db-push
      - run: pnpm run test:studio
      - run: pnpm exec vitest run --config apps/frontend/vitest.studio.config.mts
      - run: pnpm exec tsc --project apps/frontend/tsconfig.json --noEmit
      - run: pnpm run build:backend
      - run: pnpm run build:orchestrator
