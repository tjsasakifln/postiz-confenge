limit_req_zone $binary_remote_addr zone=postiz_login:1m rate=10r/m;
log_format postiz_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name postiz.confenge.com.br;
    return 301 https://postiz.confenge.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name postiz.confenge.com.br;

    ssl_certificate /etc/letsencrypt/live/postiz.confenge.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postiz.confenge.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/postiz.confenge.com.br.access.log postiz_access;
    error_log /var/log/nginx/postiz.confenge.com.br.error.log warn;
    client_max_body_size 90m;
    proxy_read_timeout 100s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cookie_domain confenge.com.br postiz.confenge.com.br;
    proxy_cookie_flags auth secure httponly samesite=lax;
    proxy_redirect http://postiz.confenge.com.br/ https://postiz.confenge.com.br/;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;

    # The private installation has one organization. Require its app session
    # for static media as well as for the Studio API.
    location = /_postiz_media_session {
        internal;
        proxy_pass http://127.0.0.1:18407/api/user/self;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Auth "";
    }

    location ^~ /uploads/ {
        auth_request /_postiz_media_session;
        proxy_pass http://127.0.0.1:18407;
    }

    location ^~ /api/uploads/ {
        return 404;
    }

    # Bootstrap uses the loopback binding before this virtual host is enabled.
    location ~* ^/api/auth/register/?$ {
        return 403;
    }

    location ~* ^/api/auth/login/?$ {
        limit_req zone=postiz_login burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18407;
    }

    # Login submits JSON through JavaScript. Block native form navigation
    # while the client is still loading so credentials cannot enter the URL.
    location ^~ /auth/ {
        add_header Content-Security-Policy "form-action 'none'" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:18407;
    }

    location = / {
        return 302 /studio$is_args$args;
    }

    location / {
        proxy_pass http://127.0.0.1:18407;
    }
}
